<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>示談金無料チェック｜FVデザイン別案</title>
  <style>
    :root { --navy:#062a59; --navy2:#0c417a; --red:#d71920; --gold:#f5cf53; --green:#06b957; }
    * { box-sizing:border-box; }
    html { background:#d9dde2; }
    body { margin:0; color:#15243a; font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",sans-serif; font-weight:700; }
    .page { width:min(100%,402px); min-height:100vh; margin:0 auto; overflow:hidden; background:#fff; box-shadow:0 0 28px rgb(0 0 0/.2); }
    .header { height:58px; padding:7px 11px; display:flex; align-items:center; gap:9px; color:var(--navy); background:#fff; }
    .logo { width:39px; height:39px; display:grid; place-items:center; flex:0 0 auto; color:#fff; background:linear-gradient(145deg,var(--navy2),var(--navy)); border-radius:50% 50% 46% 54%; font-size:19px; font-weight:900; }
    .office { font-size:16px; line-height:1.1; font-weight:900; }
    .office small { display:block; margin-top:3px; font-size:10px; letter-spacing:.08em; }
    .menu { width:34px; height:34px; margin-left:auto; display:grid; place-content:center; gap:4px; border:1px solid #ccd2d9; border-radius:50%; }
    .menu i { width:14px; height:2px; display:block; background:var(--navy); }

    .hero { position:relative; height:630px; overflow:hidden; isolation:isolate; background:var(--navy); }
    .hero::before { content:""; position:absolute; inset:0; z-index:-3; background:url("assets/fv-people-variant-b.png") center top/cover no-repeat; }
    .hero::after { content:""; position:absolute; inset:0; z-index:-2; background:linear-gradient(180deg,rgb(2 24 53/.08) 0%,transparent 42%,rgb(2 24 53/.18) 75%,rgb(2 24 53/.76) 100%); }

    .audience { position:absolute; z-index:2; top:14px; right:12px; padding:5px 9px; color:var(--navy); background:var(--gold); border-radius:2px; font-size:10px; font-weight:900; letter-spacing:.01em; }
    h1 { position:absolute; z-index:2; top:48px; right:13px; width:58%; margin:0; color:#fff; font-size:28px; line-height:1.16; letter-spacing:-.055em; font-weight:900; text-align:right; text-shadow:0 2px 3px rgb(0 0 0/.55); }
    h1 .small { display:block; margin-bottom:3px; color:#f4d86b; font-size:14px; letter-spacing:0; }

    .question-card { position:absolute; z-index:4; top:245px; left:14px; width:65%; padding:12px 13px 12px 17px; color:var(--navy); background:rgb(255 255 255/.96); border-left:7px solid var(--navy2); box-shadow:0 7px 18px rgb(0 0 0/.25); font-size:18px; line-height:1.15; }
    .question-card::after { content:""; position:absolute; right:-13px; top:20px; width:26px; height:26px; background:inherit; transform:rotate(45deg); }
    .question-card small { display:block; margin-bottom:4px; color:#637083; font-size:10px; }
    .check-note { position:absolute; z-index:5; top:325px; left:22px; padding:5px 9px; color:#fff; background:var(--red); border-radius:20px; font-size:11px; transform:rotate(-4deg); }

    .offer { position:absolute; z-index:5; top:397px; left:14px; width:57%; padding:10px 11px 11px; background:#fff; border-top:7px solid var(--red); box-shadow:0 8px 0 rgb(121 11 17/.9),0 12px 22px rgb(0 0 0/.28); text-align:left; }
    .offer .eyebrow { color:var(--navy); font-size:13px; }
    .offer strong { display:block; margin-top:1px; color:var(--red); font-size:31px; line-height:.98; letter-spacing:-.07em; }
    .offer strong span { display:inline-block; background:linear-gradient(transparent 72%,#ffe45c 72%); }
    .offer .free { position:absolute; top:-23px; right:-17px; width:55px; height:55px; display:grid; place-items:center; color:#fff; background:var(--red); border:4px solid #fff; border-radius:50%; font-size:11px; line-height:1.05; text-align:center; transform:rotate(8deg); }

    .lawyer-tag { position:absolute; z-index:4; left:0; right:0; bottom:0; min-height:94px; padding:13px 15px 10px 43%; color:#fff; background:linear-gradient(90deg,rgb(4 34 72/.93),rgb(8 59 111/.96)); border-top:3px solid var(--gold); text-align:right; }
    .lawyer-tag small { display:block; color:#f5d76b; font-size:11px; }
    .lawyer-tag b { display:block; margin-top:2px; font-size:22px; line-height:1.05; }
    .lawyer-tag span { display:block; margin-top:4px; font-size:9px; opacity:.9; }
    .photo-note { position:absolute; z-index:6; left:7px; bottom:79px; color:#fff; font-size:8px; text-shadow:0 1px 2px #000; }

    .legal { padding:5px 7px; color:#172230; background:#fff; border-bottom:1px solid #d6d9dd; font-size:8px; line-height:1.45; text-align:center; }
    .next { padding:15px 12px 88px; color:#fff; background:var(--navy); text-align:center; }
    .next b { display:block; font-size:17px; }
    .next span { display:block; margin-top:4px; color:#f5d76b; font-size:15px; }
    .sticky { position:fixed; z-index:20; left:50%; bottom:0; width:min(100%,402px); min-height:64px; transform:translateX(-50%); display:flex; align-items:center; justify-content:center; gap:10px; color:#fff; background:linear-gradient(#11c865,#05aa4c); border-top:2px solid #75e5a7; box-shadow:0 -3px 12px rgb(0 0 0/.2); font-size:20px; font-weight:900; text-decoration:none; padding-bottom:env(safe-area-inset-bottom); }
    .sticky::after { content:"›"; position:absolute; right:19px; font-size:35px; font-weight:400; }
    .line { width:45px; height:39px; display:grid; place-items:center; color:var(--green); background:#fff; border-radius:50%; font-size:10px; }
    @media (max-width:374px) { .hero{height:610px} h1{font-size:26px} .question-card{top:238px;font-size:17px} .offer{top:383px} .offer strong{font-size:29px} }
    @media (min-width:700px) { body{padding:28px 0} .sticky{bottom:28px} }
  </style>
</head>
<body>
  <main class="page">
    <header class="header">
      <div class="logo">仮</div>
      <div class="office">弁護士法人［法人名］<small>交通事故のご相談</small></div>
      <div class="menu" aria-hidden="true"><i></i><i></i><i></i></div>
    </header>
    <section class="hero">
      <div class="audience">まだ弁護士に依頼していない方へ</div>
      <h1><span class="small">保険会社から</span>示談金の提示書が<br>届いていませんか？</h1>
      <div class="question-card"><small>その提示額を見て</small>「この金額で<br>よいのだろうか…」</div>
      <div class="check-note">提示書を一緒に確認します</div>
      <div class="offer"><span class="eyebrow">正当な賠償額を</span><strong>無料で<br><span>チェック</span></strong><span class="free">LINEで<br>相談</span></div>
      <div class="lawyer-tag"><small>交通事故の示談金相談</small><b>弁護士［氏名］</b><span>所属・経歴［要確認］</span></div>
      <span class="photo-note">写真はイメージ</span>
    </section>
    <div class="legal">※無料の対象・範囲は確認中。増額を保証するものではありません。</div>
    <section class="next" id="line-b"><b>提示書の内容、気になっていませんか？</b><span>LINEで状況をお聞かせください</span></section>
  </main>
  <a class="sticky" href="#line-b"><span class="line">LINE</span><span>LINEで無料チェック</span></a>
</body>
</html>
