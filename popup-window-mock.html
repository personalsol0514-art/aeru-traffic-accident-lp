<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>示談金無料チェック｜ポップアップ案</title>
  <style>
    :root{--navy:#073568;--blue:#1477b8;--yellow:#ffe04d;--green:#06b957;--ink:#17283b}
    *{box-sizing:border-box}
    body{margin:0;background:#dfe3e7;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Yu Gothic","Hiragino Kaku Gothic ProN",sans-serif}
    .phone{position:relative;width:min(100%,402px);min-height:100vh;margin:0 auto;overflow:hidden;background:#eef5f9;box-shadow:0 0 30px rgb(0 0 0/.18)}
    .dummy{padding:34px 17px 160px}
    .dummy-label{width:100px;height:10px;margin:0 auto 18px;background:#8ab6d2;border-radius:8px}
    .dummy-title{width:78%;height:25px;margin:0 auto 11px;background:#174b76;border-radius:4px}
    .dummy-title.short{width:54%}
    .dummy-card{height:185px;margin:27px 0 18px;background:#fff;border:1px solid #d4e1e9;box-shadow:0 7px 18px rgb(7 53 104/.08)}
    .dummy-line{height:9px;margin:11px 8px;background:#cbd9e2;border-radius:6px}
    .dummy-line:nth-child(2n){width:78%}
    .scrim{position:absolute;inset:0;background:rgb(4 21 38/.52);backdrop-filter:blur(1.5px)}
    .sheet{position:absolute;z-index:2;top:48%;left:50%;width:calc(100% - 28px);padding:0 0 14px;transform:translate(-50%,-50%);color:var(--ink);background:#fff;box-shadow:0 16px 42px rgb(0 0 0/.38)}
    .surface-shine{position:absolute;z-index:8;inset:0;overflow:hidden;pointer-events:none}
    .surface-shine::before{content:"";position:absolute;top:-30%;bottom:-30%;left:-42%;width:24%;background:linear-gradient(90deg,transparent,rgb(255 255 255/.18),rgb(255 255 255/.78),rgb(255 255 255/.18),transparent);transform:translateX(-180%) skewX(-18deg);filter:blur(.4px);animation:shine-sweep 4.8s ease-in-out 1.2s infinite}
    @keyframes shine-sweep{0%,68%{transform:translateX(-180%) skewX(-18deg);opacity:0}72%{opacity:1}88%{transform:translateX(700%) skewX(-18deg);opacity:1}92%,100%{transform:translateX(700%) skewX(-18deg);opacity:0}}
    .handle{display:none}
    .close{position:absolute;top:auto;left:50%;right:auto;bottom:-70px;width:auto;height:auto;transform:translateX(-50%);display:block;color:#fff;background:transparent;border:0;border-radius:0;box-shadow:none;font-family:Arial,sans-serif;font-size:28px;font-weight:700;line-height:1;white-space:nowrap;text-shadow:0 2px 7px #000}
    .visual{position:relative;height:162px;overflow:hidden;background:#0a3c6f}
    .visual img{width:100%;height:100%;display:block;object-fit:cover;object-position:center 30%}
    .popup-content{position:relative;margin-top:-12px;padding:0 14px;z-index:3}
    .kicker{position:relative;width:max-content;margin:0 auto 8px;padding:8px 20px;color:#fff;background:#f04422;border-radius:7px;font-size:14px;font-weight:900;letter-spacing:.03em;text-align:center}
    .kicker::after{content:"";position:absolute;left:50%;bottom:-8px;transform:translateX(-50%);border-left:9px solid transparent;border-right:9px solid transparent;border-top:9px solid #f04422}
    h1{margin:0;color:var(--navy);font-family:"Yu Mincho","Hiragino Mincho ProN",serif;font-size:34px;line-height:1.1;letter-spacing:-.07em;text-align:center}
    h1 .headline-top{display:inline-block;background:linear-gradient(transparent 74%,var(--yellow) 74%)}
    h1 strong{display:inline;color:#ef3f16;background:none;font-size:38px}
    .lead{margin:7px 0 11px;color:#153252;font-size:11px;font-weight:900;line-height:1.45;text-align:center}
    .line-button{position:relative;min-height:67px;display:flex;align-items:center;justify-content:center;gap:11px;color:#fff;background:linear-gradient(100deg,#04b844,#00c650);border-radius:5px;box-shadow:0 4px 0 #078d3c;font-size:21px;font-weight:900;text-decoration:none}
    .line-icon-wrap{width:50px;height:50px;display:grid;place-items:center;flex:0 0 50px;background:#fff;border-radius:10px}
    .line-icon{width:46px;height:46px;display:block;object-fit:contain}
    .line-button::after{content:"›";position:absolute;right:13px;font-size:38px;font-weight:400}
    @media(max-height:700px){.sheet{top:46%;width:calc(100% - 36px)}.visual{height:150px}.popup-content{margin-top:-10px}.kicker{padding-block:6px}h1{font-size:32px}h1 strong{font-size:35px}.lead{font-size:10px}.line-button{min-height:62px;font-size:19px}.close{bottom:-57px}}
    @media(prefers-reduced-motion:reduce){.surface-shine::before{animation:none}}
  </style>
</head>
<body>
  <main class="phone">
    <div class="dummy" aria-hidden="true">
      <div class="dummy-label"></div>
      <div class="dummy-title"></div>
      <div class="dummy-title short"></div>
      <div class="dummy-card"></div>
      <div class="dummy-line"></div><div class="dummy-line"></div><div class="dummy-line"></div>
      <div class="dummy-card"></div>
    </div>
    <div class="scrim" aria-hidden="true"></div>
    <section class="sheet" role="dialog" aria-modal="true" aria-labelledby="popup-title">
      <div class="handle" aria-hidden="true"></div>
      <button class="close" type="button" aria-label="閉じる">× Close</button>
      <div class="surface-shine" aria-hidden="true"></div>
      <div class="visual">
        <img src="assets/popup-lawyer-consultation.png" alt="提示書を確認する相談者と弁護士のイメージ">
      </div>
      <div class="popup-content">
        <p class="kicker">提示額に同意する前に</p>
        <h1 id="popup-title"><span class="headline-top">提示書は</span><br><strong>手元</strong>にありますか？</h1>
        <p class="lead">その示談金が適正か、弁護士に確認できます。</p>
        <a class="line-button" href="#"><span class="line-icon-wrap"><img class="line-icon" src="assets/line-official-icon.png" alt="LINE"></span>LINEで無料診断</a>
      </div>
    </section>
  </main>
</body>
</html>
